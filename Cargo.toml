[package]
name = "mpc-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Authenticated, topology-aware STOMP-over-WebSocket to AMQP 0-9-1 bridge for MPC devices"
repository = "https://github.com/zafeguard/mpc-relay"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
lapin = { version = "2.5", default-features = false, features = ["rustls"] }
prometheus = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-executor-trait = "2"
tokio-reactor-trait = "1.1"
tokio-util = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tracing = "0.1"
# Same version axum uses, named only to recognise its capacity error.
tungstenite = { version = "0.29", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = "1"

[dev-dependencies]
aws-lc-rs = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio-tungstenite = "0.29"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
